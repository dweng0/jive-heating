<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17130f" media="(prefers-color-scheme: dark)" />
    <title>Heating</title>
    <style>
      :root { color-scheme: light dark; --bg: #faf7f2; --fg: #2a1606; --muted: #7a6a5c; --accent: #f28c28; }
      @media (prefers-color-scheme: dark) { :root { --bg: #17130f; --fg: #f5eee6; --muted: #b3a597; } }
      body {
        margin: 0; min-height: 100svh; display: flex; align-items: center; justify-content: center;
        background: var(--bg); color: var(--fg); text-align: center;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main { padding: 24px; max-width: 320px; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { color: var(--muted); margin: 0 0 24px; line-height: 1.4; }
      button {
        font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 12px 28px;
        background: var(--accent); color: #2a1606; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Can&rsquo;t reach the heating</h1>
      <p>Check your connection. The heating keeps running on its own schedule.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
